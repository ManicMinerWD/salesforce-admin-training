<style>
  :root{

  .topbar{padding:14px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5}

  .topbar .crumbs b{color:var(--ink)}
  .content{padding:26px 34px 60px;max-width:900px}
  .content h1{font-size:1.7rem;margin:0 0 4px}
  .content .lede{color:var(--muted);margin:0 0 22px}

<script>
/* ---------------- Course data ---------------- */
const COURSE = {
  title:"Salesforce Identity & Security Access",
  sections:[
    {
      title:"1. Course Introduction",
      lessons:[
        { id:"intro", title:"Welcome & learning map",
          lede:"What identity & security administration covers on the Platform Administrator exam, and how this module is structured.",
          video:{cap:"Module intro — the layered access model at a glance (video slot ready)."},
          body:`
          <h2>Why identity &amp; security matters on the exam</h2>
          <p>Salesforce groups user management, security, and access control under the
          <b>Configuration and Setup</b> (15%) and <b>Security</b> areas of the Platform Administrator exam.
          You are expected to <b>evaluate and configure</b> how users authenticate, what they can see,
          and what they can do.</p>
          <div class="callout"><b>Exam framing:</b> the questions rarely ask "what is a profile?" — they ask
          "a user needs X but not Y; which combination of profile, permission set, and sharing achieves it?"</div>
          <h2>The layered access model</h2>
          <ul>
            <li><b>Authentication</b> — who can log in (users, passwords, MFA, login IP/hours).</li>
            <li><b>Authorization — what they can do</b> — profiles (baseline) + permission sets (add-ons).</li>
            <li><b>Record visibility — what they can see</b> — roles, org-wide defaults, sharing rules.</li>
          </ul>`
        }
      ]
    },
    {
      title:"2. Users & Authentication",
      lessons:[
        { id:"users", title:"Users, passwords & login policies",
          lede:"Creating users, password/lockout policy, and restricting when/where people can log in.",
          video:{cap:"Creating a user and setting login hours + IP ranges (video slot ready)."},
          body:`
          <h2>User records</h2>
          <p>A <b>user</b> is a login identity. Each user has a profile (their baseline permissions) and
          belongs to a role (their place in the record-sharing hierarchy). When someone leaves, you
          <b>deactivate</b> the user and reassign their records — you do not delete users.</p>
          <div class="callout tip"><b>Rule of thumb:</b> never delete a user. Deactivation freezes access and
          preserves historical ownership of records.</div>
          <h2>Password &amp; lockout policy</h2>
          <ul>
            <li>Set password complexity, expiry, and lockout attempts org-wide.</li>
            <li>Admins can <b>reset password</b> and <b>unlock</b> a user from the user record.</li>
          </ul>
          <h2>Controlling login time &amp; location</h2>
          <ul>
            <li><b>Login Hours</b> — restrict the window a user can log in (e.g. 9–5).</li>
            <li><b>Login IP Ranges</b> — allow logins only from trusted networks; outside ranges require a
            activation or are blocked depending on policy.</li>
            <li><b>Multi-Factor Authentication (MFA)</b> — enforce via permission set / session settings.</li>
          </ul>
          ${diagramLogin()}`
        },
        { id:"mfa", title:"Multi-Factor Authentication (MFA)",
          lede:"Why MFA is mandatory and how it is enforced for admins and users.",
          video:{cap:"Enforcing MFA through a permission set (video slot ready)."},
          body:`
          <h2>MFA is required</h2>
          <p>Salesforce requires MFA for all users accessing the UI. As an admin you enforce it with a
          <b>permission set</b> (e.g. the standard "MFA Enforcement" permission set) or via
          <b>Session Security Policies</b>.</p>
          <div class="callout"><b>Watch the exam wording:</b> "How do you require MFA?" &rarr; assign the MFA
          Enforcement permission set (or set it in session settings) — not a profile field toggle alone.</div>
          <ul>
            <li>MFA factors: Salesforce Authenticator app, third-party TOTP apps, security keys.</li>
            <li>Session settings also control <b>session timeout</b> and <b>IP relaxations</b>.</li>
          </ul>`
        }
      ]
    },
    {
      title:"3. What Users Can Do — Profiles & Permission Sets",
      lessons:[
        { id:"profiles", title:"Profiles (baseline permissions)",
          lede:"The profile defines the floor of what a user can access and do.",
          video:{cap:"Anatomy of a profile — object perms, FLS, tabs, apps (video slot ready)."},
          body:`
          <h2>What a profile controls</h2>
          <ul>
            <li><b>Object permissions</b> — create/read/edit/delete per object.</li>
            <li><b>Field-level security (FLS)</b> — which fields a user can see or edit.</li>
            <li><b>Tab visibility</b> — default on / default off / hidden.</li>
            <li><b>App visibility</b> and assigned <b>connected apps</b>.</li>
            <li><b>Page layouts</b> and <b>record types</b> (via the profile).</li>
            <li><b>Login hours &amp; IP ranges</b> (can also live here).</li>
          </ul>
          <div class="callout tip"><b>Profiles vs permission sets:</b> a user has <b>one</b> profile but can have
          <b>many</b> permission sets. Use the profile for the job's baseline; use permission sets for
          exceptions and additive rights.</div>
          ${diagramAccess()}`
        },
        { id:"permsets", title:"Permission Sets & Permission Set Groups",
          lede:"Add rights without cloning profiles — the modern, recommended approach.",
          video:{cap:"Layering a permission set on top of a profile (video slot ready)."},
          body:`
          <h2>Permission sets</h2>
          <p>A <b>permission set</b> grants additional permissions (objects, FLS, apps, system perms) on top of
          a user's profile. They are <b>additive</b> and let you grant specific access to a subset of users
          without maintaining many profiles.</p>
          <h2>Permission set groups</h2>
          <p>A <b>permission set group</b> bundles multiple permission sets so you assign one group instead of
          several individual sets — easier to manage and audit.</p>
          <div class="callout"><b>Exam pattern:</b> "Only the deal-desk team needs Delete on Opportunities."
          &rarr; keep the profile read/write, add a permission set with Delete on Opportunity to those users.</div>`
        }
      ]
    },
    {
      title:"4. What Users Can See — Record Sharing",
      lessons:[
        { id:"roles", title:"Roles & Role Hierarchy",
          lede:"How the role hierarchy opens record visibility up the chain.",
          video:{cap:"Building a role hierarchy funnel (video slot ready)."},
          body:`
          <h2>Roles control record visibility, not permissions</h2>
          <p>A <b>role</b> places a user in the <b>role hierarchy</b>. Users can see records owned by themselves
          and by anyone <b>below</b> them in the hierarchy. Roles do <b>not</b> grant object/field permissions —
          that is the profile's job.</p>
          <ul>
            <li>Roles are about <b>records you can see</b>; profiles are about <b>what you can do</b>.</li>
            <li>Role hierarchy grants <b>implicit</b> access upward; it does not restrict downward.</li>
          </ul>
          ${diagramRoles()}`
        },
        { id:"owd", title:"Organization-Wide Defaults (OWD)",
          lede:"The starting point for record sharing — restrict first, open up selectively.",
          video:{cap:"Setting OWD to Private vs Public Read Only (video slot ready)."},
          body:`
          <h2>OWD = the baseline</h2>
          <p><b>Organization-Wide Defaults</b> set the <i>most restrictive</i> default access for each object
          (Private, Public Read Only, Public Read/Write). Everything else (roles, sharing rules, manual share,
          teams) only <b>opens up</b> from this baseline.</p>
          <ul>
            <li><b>Private</b> — only owner and above-them roles see the record.</li>
            <li><b>Public Read Only</b> — all users see; only owner edits.</li>
            <li><b>Public Read/Write</b> — all users can edit.</li>
          </ul>
          <div class="callout tip"><b>Best practice:</b> set OWD as restrictive as the business allows, then grant
          access with roles/sharing rules. "Secure by default."</div>`
        },
        { id:"sharing", title:"Sharing Rules, Manual Share & Teams",
          lede:"Opening records beyond the role hierarchy — automatically and on demand.",
          video:{cap:"A criteria-based sharing rule opening records to a public group (video slot ready)."},
          body:`
          <h2>Sharing rules</h2>
          <p>A <b>sharing rule</b> grants access to records users don't own, based on <b>ownership</b> (owner in
          X role/group) or <b>criteria</b> (field values, e.g. Region = APAC). They only <b>extend</b> beyond
          the OWD — you cannot use a sharing rule to make things more private.</p>
          <ul>
            <li>Sharing rules grant access to <b>roles, public groups, or territories</b>, not individuals directly.</li>
            <li>They run one-way: from a more restrictive to a less restrictive setting.</li>
          </ul>
          <h2>Manual sharing &amp; teams</h2>
          <ul>
            <li><b>Manual sharing</b> — a record owner shares a single record with specific users/roles/groups.</li>
            <li><b>Account/Case Teams</b> — collaborate by granting a team of users access to a record.</li>
          </ul>
          ${diagramSharing()}`
        }
      ]
    },
    {
      title:"5. Put It Together & Practice",
      lessons:[
        { id:"scenario", title:"Scenario walkthrough",
          lede:"A worked example mapping a business requirement to the right access design.",
          video:{cap:"Whiteboard: a deal-desk + APAC visibility requirement (video slot ready)."},
          body:`
          <h2>Requirement</h2>
          <p>"APAC sales reps should see all APAC accounts and edit their own; deal-desk analysts (any region)
          need Delete on Opportunities; managers must see their team's pipelines."</p>
          <h2>Design</h2>
          <ul>
            <li><b>Profile</b> (Sales Rep): Read/Write on Account &amp; Opportunity, no Delete.</li>
            <li><b>OWD</b>: Account &amp; Opportunity = <b>Private</b> (restrictive baseline).</li>
            <li><b>Role hierarchy</b>: managers above reps &rarr; managers see team records automatically.</li>
            <li><b>Sharing rule (criteria)</b>: Account Region = APAC &rarr; share with "APAC Sales" public group (Read/Write).</li>
            <li><b>Permission set</b>: "Deal Desk Delete" &rarr; assign Delete on Opportunity to deal-desk analysts only.</li>
          </ul>
          <div class="callout"><b>Result:</b> baseline is private, roles open manager visibility, a sharing rule
          opens APAC accounts, and a permission set adds the narrow Delete right. Each layer does one job.</div>
          <p>Pair this with the practice exam: <a href="https://manicminerwd.github.io/salesforce-admin-practice-exam/" target="_blank" rel="noopener">Salesforce Admin practice exam &rarr;</a></p>`
        },
        { id:"summary", title:"Key takeaways & exam checklist",
          lede:"The mental model to carry into the exam.",
          video:{cap:"Recap of the layered model (video slot ready)."},
          body:`
          <h2>The layered model (memorize this)</h2>
          <ul>
            <li><b>Profile</b> = baseline of what you can do (objects, FLS, tabs, apps). One per user.</li>
            <li><b>Permission set</b> = additive rights. Many per user. Group them with permission set groups.</li>
            <li><b>Role</b> = where you sit in the hierarchy; opens record visibility upward.</li>
            <li><b>OWD</b> = the restrictive baseline for record visibility.</li>
            <li><b>Sharing rules</b> = open records beyond OWD (ownership or criteria based), never more private.</li>
            <li><b>Manual share / teams</b> = one-off or collaborative access to specific records.</li>
            <li><b>Login hours / IP ranges / MFA</b> = authentication controls.</li>
          </ul>
          <div class="callout tip"><b>One-line summary:</b> Profiles &amp; permission sets decide <i>what you can do</i>;
          roles, OWD, and sharing rules decide <i>what you can see</i>.</div>`
        }
      ]
    }
  ]
};

function diagramRoles(){
  return `<div class="diagram"><svg viewBox="0 0 640 220" role="img" aria-label="Role hierarchy">
    <polygon points="320,20 470,90 170,90" fill="#172033" stroke="#00a1e0"/>
    <text x="320" y="70" fill="#e8edf7" font-size="13" text-anchor="middle">VP Sales</text>

/* ---------------- State / rendering ---------------- */
const ALL = [];
COURSE.sections.forEach(s=>s.lessons.forEach(l=>ALL.push(l)));
const STORE = "sf_idsec_progress_v1";
function loadDone(){ try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }catch(e){ return {}; } }
function saveDone(d){ localStorage.setItem(STORE, JSON.stringify(d)); }
let done = loadDone();
let currentId = ALL[0].id;

function buildCurriculum(){
  const root = document.getElementById('curriculum');
  root.innerHTML = COURSE.sections.map((sec,si)=>{
    const lessons = sec.lessons.map(l=>{
      const isDone = done[l.id];
      return `<li class="lesson ${isDone?'done':''}" data-id="${l.id}">
        <span class="dot">${isDone?'&#10003;':''}</span>
        <span class="ttl">${l.title}</span></li>`;
    }).join('');
    return `<div class="sec"><div class="sec-head" data-sec="${si}">${sec.title}<span>&#9662;</span></div>
      <ul class="lessons">${lessons}</ul></div>`;
  }).join('');
  root.querySelectorAll('.lesson').forEach(el=>{
    el.addEventListener('click',()=>{ currentId=el.dataset.id; render(); document.getElementById('side').classList.remove('open'); });
  });
  root.querySelectorAll('.sec-head').forEach(el=>{
    el.addEventListener('click',()=>{ const ul=el.nextElementSibling; ul.style.display = ul.style.display==='none'?'block':'none'; });
  });
}
function findLesson(id){ return ALL.find(l=>l.id===id); }
function findPos(id){ return ALL.findIndex(l=>l.id===id); }

function render(){
  const l = findLesson(currentId);
  const pos = findPos(currentId);
  // crumbs + count
  document.getElementById('crumbs').innerHTML = `<b>${COURSE.title}</b>`;
  document.getElementById('lessonCount').textContent = `Lesson ${pos+1} of ${ALL.length}`;
  // mark active in sidebar
  document.querySelectorAll('.lesson').forEach(el=>el.classList.toggle('active', el.dataset.id===currentId));
  // content
  const videoHTML = l.video ? `
    <div class="video-slot">
      <div class="player" id="player-${l.id}">
        <div>[ Video slot &mdash; drop your clip at <code>assets/${l.id}.mp4</code> or paste a YouTube/mp4 URL in <code>index.html</code> &middot; see README ]</div>
      </div>
      <div class="cap">${l.video.cap}</div>
    </div>` : '';
  const content = document.getElementById('content');
  content.innerHTML = `
    <h1>${l.title}</h1>
    <p class="lede">${l.lede}</p>
    ${videoHTML}
    <div class="body">${l.body}</div>
    <div class="complete-row">
      <label><input type="checkbox" id="doneChk" ${done[l.id]?'checked':''}> Mark this lesson complete</label>
    </div>
    <div class="nav">
      <button class="ghost" id="prevBtn" ${pos===0?'disabled':''}>&#8592; Previous</button>
      <button id="nextBtn" ${pos===ALL.length-1?'disabled':''}>Next &#8594;</button>
    </div>`;
  document.getElementById('doneChk').addEventListener('change',e=>{
    done[l.id]=e.target.checked; saveDone(done); buildCurriculum(); renderProgress();
  });
  document.getElementById('prevBtn').addEventListener('click',()=>{ if(pos>0){ currentId=ALL[pos-1].id; render(); } });
  document.getElementById('nextBtn').addEventListener('click',()=>{ if(pos<ALL.length-1){ currentId=ALL[pos+1].id; render(); } });
  content.scrollIntoView({behavior:'smooth',block:'start'});
  // attach video if present
  attachVideo(l);
  renderProgress();
}
function attachVideo(l){
  if(!l.video) return;
  const urls = (window.VIDEO_SOURCES && window.VIDEO_SOURCES[l.id]) || null;
  const player = document.getElementById('player-'+l.id);
  if(!player || !urls) return;
  if(typeof urls === 'string' && urls.includes('youtube')){
    player.innerHTML = `<iframe width="100%" height="100%" style="border:0;min-height:320px" src="${urls}" allowfullscreen></iframe>`;
  } else {
    player.innerHTML = `<video controls src="${urls}"></video>`;
  }
}
function renderProgress(){
  const total = ALL.length;
  const completed = ALL.filter(l=>done[l.id]).length;
  const pct = total? Math.round(completed/total*100):0;
  document.getElementById('progbar').style.width = pct+'%';
  document.getElementById('progtext').textContent = `${completed} / ${total} lessons complete`;
}

document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('side').classList.toggle('open');
});
buildCurriculum(); render(); renderProgress();
</script>
